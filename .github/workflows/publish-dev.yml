name: Publish dev marketplace
on:
  push:
    branches:
      - main
  workflow_dispatch: {}
permissions:
  contents: write
  packages: read
concurrency:
  group: publish-dev-marketplace
  cancel-in-progress: false
jobs:
  publish:
    runs-on: namespace-profile-2x4
    timeout-minutes: 10
    steps:
      - uses: namespacelabs/nscloud-checkout-action@66f2dc6f6c42a8ac6c4e53473c4840006822831e # v9.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          registry-url: https://npm.pkg.github.com
          scope: "@superblocksteam"
      - name: Test plugin and dev publication
        run: node --test tests/*.test.mjs
      - name: Publish dev from the latest main
        run: node .github/scripts/publish-dev.mjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
