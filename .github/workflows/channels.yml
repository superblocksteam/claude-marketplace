name: Channels
"on":
  pull_request:
    branches:
      - main
      - next
      - master
  push:
    branches:
      - main
      - next
      - master
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  check:
    uses: ./.github/workflows/channel.yml
    with:
      channel:
        ${{ (github.base_ref || github.ref_name) == 'master' && 'dev' || (github.base_ref || github.ref_name)
        == 'next' && 'next' || 'beta' }}
    secrets: inherit
    concurrency:
      group: channels-check-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
  forward-next:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: check
    uses: ./.github/workflows/channel.yml
    with:
      channel: next
      forward-from: ${{ github.sha }}
    secrets: inherit
    concurrency:
      group: channel-promotion-next
      cancel-in-progress: false
  forward-dev:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/next'
    needs: check
    uses: ./.github/workflows/channel.yml
    with:
      channel: dev
      forward-from: ${{ github.sha }}
    secrets: inherit
    concurrency:
      group: channel-promotion-dev
      cancel-in-progress: false
