name: Channels
"on":
  pull_request:
    branches:
      - main
      - next
      - master
  push:
    branches:
      - main
      - next
      - master
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: channels-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    uses: ./.github/workflows/channel.yml
    with:
      channel:
        ${{ (github.base_ref || github.ref_name) == 'master' && 'dev' || (github.base_ref || github.ref_name)
        == 'next' && 'next' || 'beta' }}
    secrets:
      github-packages-token: ${{ secrets.GH_PACKAGES_READ_TOKEN }}
  forward-next:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: check
    permissions:
      contents: write
    uses: ./.github/workflows/channel.yml
    with:
      channel: next
      forward-from: ${{ github.sha }}
  forward-dev:
    if:
      ${{ always() && !cancelled() && github.event_name != 'pull_request' && needs.check.result == 'success' &&
      ((github.ref == 'refs/heads/main' && needs.forward-next.result == 'success') || github.ref == 'refs/heads/next')
      }}
    needs:
      - check
      - forward-next
    permissions:
      contents: write
    uses: ./.github/workflows/channel.yml
    with:
      channel: dev
      ref: ${{ needs.forward-next.outputs.commit || github.sha }}
      forward-from: ${{ needs.forward-next.outputs.commit || github.sha }}
    secrets:
      github-packages-token: ${{ secrets.GH_PACKAGES_READ_TOKEN }}
