name: Check channel publication credential
"on":
  workflow_call:
    secrets:
      channel-publish-token:
        required: false
permissions: {}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require channel publication credential before verification
        env:
          GH_TOKEN: ${{ secrets.channel-publish-token }}
        run:
          test -n "$GH_TOKEN" || { echo "Configure CHANNEL_PUBLISH_TOKEN with contents and workflows
          write permissions before running channel publication." >&2; exit 1; }
