name: Release Cowork plugin
"on":
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: release-cowork-plugin
  cancel-in-progress: false
jobs:
  build:
    runs-on: namespace-profile-macos
    timeout-minutes: 20
    steps:
      - uses: namespacelabs/nscloud-checkout-action@66f2dc6f6c42a8ac6c4e53473c4840006822831e # v9.0.1
        with:
          persist-credentials: "false"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: Install locked packaging tools
        run: npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org/
      - name: Test plugin and packaging
        run: node --test tests/*.test.mjs
      - name: Install locked CLI
        working-directory: plugins/superblocks-plugin
        run: npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org/
          --@superblocksteam:registry=https://registry.npmjs.org/
      - name: Build Cowork ZIP and standalone MCPB
        run: node .github/scripts/build-mcpb.mjs plugins/superblocks-plugin dist
      - name: Require credentialless startup and Login
        run: python3 .github/scripts/smoke-mcpb.py dist/*.mcpb
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cowork-release
          path: |-
            dist/*.zip
            dist/*.mcpb
          if-no-files-found: error
          retention-days: 1
  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cowork-release
          path: dist
      - name: Create draft beta release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: cowork-beta-${{ github.run_id }}-${{ github.run_attempt }}
          target_commitish: ${{ github.sha }}
          name: Superblocks Cowork beta (${{ github.run_id }}.${{ github.run_attempt }})
          draft: "true"
          prerelease: "true"
          make_latest: "false"
          overwrite_files: "false"
          fail_on_unmatched_files: "true"
          files: |-
            dist/*.zip
            dist/*.mcpb
          body:
            Upload the ZIP under Cowork Customize > Plugins, then start a new task and run /configure. The standalone MCPB
            is also attached. The CLI pinned by the plugin lockfile at this commit is preinstalled; its exact version,
            operating system, and architecture are recorded in each filename. Node.js 24 or newer is required. Generated
            by GitHub Actions.
