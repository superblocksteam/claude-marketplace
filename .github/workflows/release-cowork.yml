name: Release Cowork plugin
"on":
  workflow_dispatch:
    inputs:
      channel:
        description: Public channel whose pinned CLI the release preinstalls
        type: choice
        options:
          - next
          - beta
        default: next
permissions:
  contents: read
concurrency:
  group: release-cowork-plugin
  cancel-in-progress: false
jobs:
  build:
    uses: ./.github/workflows/channel.yml
    with:
      channel: ${{ inputs.channel }}
      runner: namespace-profile-macos
      upload: true
  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cowork-${{ inputs.channel }}
          path: dist
      - name: Create draft release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: cowork-${{ inputs.channel }}-${{ github.run_id }}-${{ github.run_attempt }}
          target_commitish: ${{ github.sha }}
          name: Superblocks Cowork ${{ inputs.channel }} (${{ github.run_id }}.${{ github.run_attempt }})
          draft: "true"
          prerelease: "true"
          make_latest: "false"
          overwrite_files: "false"
          fail_on_unmatched_files: "true"
          files: |-
            dist/*.zip
            dist/*.mcpb
          body:
            Upload the ZIP under Cowork Customize > Plugins, then start a new task and run /configure. The standalone MCPB
            is also attached. The CLI pinned for this channel at this commit is preinstalled; the channel, exact CLI
            version, operating system, and architecture are recorded in each filename. Node.js 24 or newer is required.
            Generated by GitHub Actions.
