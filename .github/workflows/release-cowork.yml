name: Release Cowork plugin
"on":
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: release-cowork-plugin
  cancel-in-progress: false
jobs:
  release:
    runs-on: namespace-profile-macos
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: namespacelabs/nscloud-checkout-action@66f2dc6f6c42a8ac6c4e53473c4840006822831e # v9.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: Test plugin and packaging
        run: node --test tests/*.test.mjs
      - name: Install latest public beta CLI
        working-directory: plugins/superblocks-plugin
        run:
          npm install --package-lock=false --ignore-scripts --no-audit --no-fund --prefer-online --registry=https://registry.npmjs.org/
          --@superblocksteam:registry=https://registry.npmjs.org/ @superblocksteam/cli@beta
      - name: Build Cowork ZIP and standalone MCPB
        run: node .github/scripts/build-mcpb.mjs plugins/superblocks-plugin dist
      - name: Require credentialless startup and Login
        run: python3 .github/scripts/smoke-mcpb.py dist/*.mcpb
      - name: Create draft beta release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: cowork-beta-${{ github.run_id }}-${{ github.run_attempt }}
          target_commitish: ${{ github.sha }}
          name: Superblocks Cowork beta (${{ github.run_id }}.${{ github.run_attempt }})
          draft: "true"
          prerelease: "true"
          make_latest: "false"
          overwrite_files: "false"
          fail_on_unmatched_files: "true"
          files: |-
            dist/*.zip
            dist/*.mcpb
          body:
            Upload the ZIP under Cowork Customize > Plugins, then start a new task and run /configure. The standalone MCPB
            is also attached. The public npm beta CLI is preinstalled; its exact version, operating system, and architecture
            are recorded in each filename. Node.js 24 or newer is required. Generated by GitHub Actions.
